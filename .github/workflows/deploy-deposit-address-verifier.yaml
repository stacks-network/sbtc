name: Deploy sBTC address constructor

on:
  push:
    branches:
      - main
    paths:
      - "web/deposit-address-verifier/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-deposit-address-verifier.yaml"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: pages-deposit-address-verifier
  cancel-in-progress: true

env:
  NODE_VERSION: 24.15.0

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: stacks-sbtc/actions/checkout@505c42b153ba2ac261c276e96bc5dc7b68d61039

      - name: Setup pnpm
        uses: stacks-sbtc/actions/setup-pnpm@505c42b153ba2ac261c276e96bc5dc7b68d61039

      - name: Setup Node
        uses: stacks-sbtc/actions/setup-node@505c42b153ba2ac261c276e96bc5dc7b68d61039
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test address constructor
        run: pnpm --filter @stacks-sbtc/deposit-address-verifier test

      - name: Build address constructor
        run: pnpm --filter @stacks-sbtc/deposit-address-verifier build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/deposit-address-verifier/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
